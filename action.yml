name: "Say hello"
description: "A simple composite action example"
inputs:
  who:
    description: "Who to greet"
    required: true
    default: "world"
outputs:
  result:
    description: "The greeting message"
runs:
  using: "composite"
  steps:
    - name: Run script
      shell: bash
      run: |
        msg="Hello, ${{ inputs.who }}!"
        echo "$msg"
        echo "result=$msg" >> "$GITHUB_OUTPUT"

